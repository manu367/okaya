<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<div class="grid md:grid-cols-4 gap-4 grid-flow-row auto-cols-max">
    <div class="bg-red-200">1</div>
    <div class="bg-blue-200">2</div>
    <div class="bg-green-200">3</div>
    <div class="bg-yellow-200">4</div>
</div>
<button id="click_me" style="color: black;background: white;outline:1px solid #0c0c0c">click me</button>

<script>
    document.getElementById("click_me").addEventListener("click",()=>{
        fetch("dummy.php?op=Add",{
            headers:{
                "Manu-Auth-Page": "manu_auth-page",
                "Previous-Header": "previous_header"
            }
        })
            .then(res => res.text())
            .then(html=>{
                document.body.innerHTML=html;
                // history.pushState(null,"","dummy.php");
                history.replaceState(null, "", "dummy.php");
            });
    });
</script>

<div class="bg-gray-900 text-green-400 p-4 rounded-lg font-mono text-sm">
    Punjab National Bank =41


</body>
</html>
